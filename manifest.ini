name = "copyURL"
summary = "Copy URL"
description = "For web browsers only. Copies the URL of the current page or of a link at the cursor to the clipboard and announces it. Both command gestures can be configured through NVDA's Input Gestures dialog. The Copy Link URL command can be turned off in settings. Copy Page URL may be unavailable in Edge when UIA browse mode is enabled; see the add-on help."
author = "Dennis Long <dennisl@fastmail.com>"
version = "1.9.3"
changelog = "Checks GitHub for updates. Once a day, a little after NVDA starts, Copy URL asks github.com/joshknnd1982/copyURL whether a newer version has been released, and says nothing unless there is one. When there is, a dialog shows what's new and offers to download and install it; the download must match the release's SHA-256 checksum, and NVDA asks you to confirm the installation. To check yourself, choose Tools, Check for add-on updates, Copy URL in the NVDA menu, or press Check for updates now in Copy URL's settings, where the daily check can also be turned off. Copying URLs works as before."
url = "https://github.com/joshknnd1982/copyURL"
docFileName = "readme.html"
minimumNVDAVersion = "2019.3.0"
lastTestedNVDAVersion = "2026.1.1"
