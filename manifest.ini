name = "copyURL"
summary = "Copy URL"
description = "For web browsers only. Copies the URL of the current page or of a link at the cursor to the clipboard and announces it, in normal browse mode and in UIA browse mode alike. Both command gestures can be configured through NVDA's Input Gestures dialog. The Copy Link URL command can be turned off in settings."
author = "Dennis Long <dennisl@fastmail.com>"
version = "1.9.4"
changelog = "Works in UIA browse mode. When NVDA reads Edge or another Chromium browser through UI Automation, whether you chose Yes for Use UIA with Microsoft Edge and other Chromium based browsers in NVDA's Advanced settings or NVDA chose UI Automation by default, Copy Page URL now copies the page's address. Before, it said No URL found or copied a number such as 792. It also finds the page when focus is in the browser's address bar or toolbar. Copy Link URL now finds the link at the browse-mode cursor even when the navigator object has not followed it, finds the focused link in focus mode, and finds links whose text is bold or otherwise formatted several levels deep."
url = "https://github.com/joshknnd1982/copyURL"
docFileName = "readme.html"
minimumNVDAVersion = "2019.3.0"
lastTestedNVDAVersion = "2026.1.1"
